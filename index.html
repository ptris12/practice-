<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="landing-page">
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="card" id="valentine-card">
    <h1>Will you be my Valentine?</h1>
    <p class="subtitle">I made this just for you, Marijana 💌</p>

    <div class="button-row">
      <button id="yes-btn" class="btn btn-yes" type="button">Yes 💖</button>
      <button id="no-btn" class="btn btn-no" type="button">No 🙈</button>
    </div>

    <p id="result-message" class="result-message" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
